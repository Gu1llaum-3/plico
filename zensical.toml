[project]
site_name = "plico"
site_description = "Pull-based GitOps deployer for standalone Docker Compose stacks"
site_url = "https://gu1llaum-3.github.io/plico/"
repo_url = "https://github.com/Gu1llaum-3/plico"
repo_name = "Gu1llaum-3/plico"
edit_uri = "edit/main/docs/"
copyright = "plico — orchestrate git, sops and docker compose, never reimplement them."
docs_dir = "docs"
site_dir = "site"

# Explicit navigation: ordering is intentional, not filename-alphabetical.
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Configuration" = "getting-started/configuration.md" },
    { "Your first deployment" = "getting-started/first-deployment.md" },
  ] },
  { "Concepts" = [
    { "The deploy pipeline" = "concepts/pipeline.md" },
    { "Scheduling & windows" = "concepts/scheduling.md" },
    { "Monorepos" = "concepts/monorepo.md" },
    { "Layered hooks" = "concepts/hooks.md" },
    { "Secrets" = "concepts/secrets.md" },
    { "Authentication" = "concepts/authentication.md" },
    { "Monitoring & health" = "concepts/monitoring.md" },
    { "Server vs repo config" = "concepts/trust-boundary.md" },
    { "Design principles" = "concepts/design-principles.md" },
  ] },
  { "Guides" = [
    { "Encrypt secrets with SOPS" = "guides/sops-secrets.md" },
    { "Write a repo-side recipe" = "guides/repo-recipe.md" },
    { "A backup pre-deploy hook" = "guides/backup-hook.md" },
    { "Deploy a monorepo" = "guides/monorepo-setup.md" },
    { "Configure notifications" = "guides/notifications.md" },
    { "Bind-mount a secret file" = "guides/secret-files.md" },
    { "Restrict deploys to a window" = "guides/scheduling-windows.md" },
  ] },
  { "Reference" = [
    { "Server configuration" = "reference/config.md" },
    { "Per-stack options" = "reference/stack-options.md" },
    { "Repo manifest (.plico.toml)" = "reference/manifest.md" },
    { "Notification events" = "reference/events.md" },
    { "CLI" = "reference/cli.md" },
  ] },
  { "Operations" = [
    { "System layout" = "operations/layout.md" },
    { "Supervision (systemd)" = "operations/supervision.md" },
    { "Upgrades & rollback" = "operations/upgrades.md" },
    { "Migrating older installs" = "operations/migration.md" },
    { "Moving a stack with data" = "operations/moving-stateful-stacks.md" },
    { "Diagnostics" = "operations/diagnostics.md" },
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.footer",
  "navigation.indexes",
  "toc.follow",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "search.highlight",
  "search.suggest",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Admonitions, code highlight/copy/annotate, content tabs, details, and mermaid
# (the superfences custom fence) are all enabled by default — do NOT redeclare
# `pymdownx.superfences` here, as an empty override drops the mermaid fence.
